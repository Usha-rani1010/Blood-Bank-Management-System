spring.application.name=blood-bank-management

# MySQL Database (supports cloud environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bloodbank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:DaddyUsha@1010}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Port (Cloud providers inject PORT)
server.port=${PORT:8082}

# JWT Security
app.jwt.secret=${JWT_SECRET:BloodBankManagementSystemSecretKey2026SecureKeyWithAtLeast256BitsLength!}
app.jwt.expiration-ms=86400000

# Super Admin Bootstrap (creates on startup if no SUPER_ADMIN exists)
app.superadmin.name=${SUPERADMIN_NAME:Super Administrator}
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@bloodbank.org}
app.superadmin.password=${SUPERADMIN_PASSWORD:SuperAdmin@2026!}

# Multipart File Upload (Max 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/certificates}